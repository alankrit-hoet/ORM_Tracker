name: ORM tracker

on:
  schedule:
    # 03:15 UTC Monday = 08:45 IST, after the weekend's sessions are uploaded.
    - cron: "15 3 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Reprocess every session, ignoring cached state"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # state.json lets the tracker skip sessions whose transcript has not
      # changed. Losing the cache costs time, never correctness -- rows are
      # upserted by key.
      - uses: actions/cache@v4
        with:
          path: state.json
          key: orm-tracker-state-${{ github.run_id }}
          restore-keys: orm-tracker-state-

      # Two supported routes. GOOGLE_OAUTH_TOKEN_JSON runs as a real person's
      # Google account (enough with Content Manager on the Shared Drive);
      # GOOGLE_SERVICE_ACCOUNT_JSON needs a Drive Manager to add the service
      # account as a member. Set whichever one you have.
      - name: Write credentials
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          if [ -n "$SA_JSON" ]; then
            printf '%s' "$SA_JSON" > "$RUNNER_TEMP/creds.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/creds.json" >> "$GITHUB_ENV"
          elif [ -n "$OAUTH_JSON" ]; then
            printf '%s' "$OAUTH_JSON" > "$RUNNER_TEMP/creds.json"
            echo "GOOGLE_OAUTH_TOKEN=$RUNNER_TEMP/creds.json" >> "$GITHUB_ENV"
          else
            echo "::error::set GOOGLE_OAUTH_TOKEN_JSON or GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

      - name: Run tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m orm_tracker.cli ${{ inputs.full && '--full' || '' }}

      - if: always()
        run: rm -f "$RUNNER_TEMP/creds.json"
